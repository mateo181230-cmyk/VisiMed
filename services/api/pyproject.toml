[project]
name = "uno-api"
version = "0.1.0"
description = "UNO Visitas · API (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "pywebpush>=2.0",
  "aiosmtplib>=3.0",
  "tzdata>=2024.1",
  "structlog>=24.4",
  "cryptography>=50.0.1",
  "httpx>=0.27",
]

[project.scripts]
uno = "uno.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uno"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501"]
"migrations/**" = ["E501", "UP007", "UP035", "I001", "F401"]
"src/uno/cli.py" = ["S105", "S106"]
# Textos literales largos (instrucciones del médico, rúbrica de Novamed, diálogos de ejemplo).
"src/uno/modules/training/prompts.py" = ["E501"]
"src/uno/modules/training/rubric.py" = ["E501"]
"src/uno/modules/training/samples.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
