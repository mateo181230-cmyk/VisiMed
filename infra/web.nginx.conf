server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Releases have reproducible file timestamps. Never validate HTML by mtime/size.
    etag off;
    if_modified_since off;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
    # Docker actualiza la IP de api al recrear el contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $uno_api http://api:8000;

    location = /v1/territory/library/import {
        client_max_body_size 21m;
        proxy_pass $uno_api;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass $uno_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }

    location = /salud {
        proxy_pass $uno_api;
        access_log off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /territorio { return 302 /territorio/; }
    location = /territorio/sw.js { add_header Cache-Control "no-cache" always; }
    location = /territory-launcher.js { add_header Cache-Control "no-cache" always; }
    location ^~ /territorio/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /territorio/ { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /territorio/index.html; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # /entrenar también es el directorio de fotos: la ruta debe abrir la SPA.
        try_files $uri /index.html;
    }
}
