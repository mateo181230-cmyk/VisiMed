# Servidor Contabo: /etc/nginx/sites-available/uno-visitas
# Emitir el certificado con webroot /var/www/uno-visitas-acme antes de activar HTTPS.
# Este archivo se incluye dentro de http{}; las zonas solo las usa el vhost de UNO.
limit_req_zone $binary_remote_addr zone=uno_auth_ip:10m rate=1r/s;
limit_req_zone $server_name zone=uno_auth_total:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name novamed.hyperionone.co novamed.169-58-83-178.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/uno-visitas-acme;
    }
    location / {
        return 301 https://novamed.hyperionone.co$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novamed.hyperionone.co novamed.169-58-83-178.sslip.io;
    ssl_certificate /etc/letsencrypt/live/novamed.hyperionone.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novamed.hyperionone.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

    location ~ ^/v1/auth/(login|register)$ {
        limit_req zone=uno_auth_ip burst=10 nodelay;
        limit_req zone=uno_auth_total burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @uno_auth_limited;
        proxy_pass http://127.0.0.1:3280;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location @uno_auth_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detail":{"code":"too_many_attempts","message":"Demasiados intentos. Espera un momento e inténtalo de nuevo"}}';
    }

    location / {
        proxy_pass http://127.0.0.1:3280;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
